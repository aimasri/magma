[databases]
# Forward traffic to the local PostgreSQL instance
fb_cakes_db = host=127.0.0.1 port=5432 dbname=fb_cakes_db

[pgbouncer]
listen_port = 6432
listen_addr = 127.0.0.1
auth_type = md5
auth_file = userlist.txt

# Transaction pooling is the gold standard for high-scale web apps.
# The connection is released back to the pool the moment the transaction commits/rolls back.
pool_mode = transaction

# Max client connections allowed to connect to PgBouncer
max_client_conn = 1000

# Max server connections allowed to connect to PostgreSQL per pool
default_pool_size = 20

# Optional: Drop server connections if idle for too long
server_idle_timeout = 600
